<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة استار لينك القابضة</title>
    <style>
        :root { --primary: #00d2ff; --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        header { background: #1e1b4b; padding: 2rem; text-align: center; color: var(--primary); }
        nav { background: #1e293b; display: flex; justify-content: center; gap: 15px; padding: 1rem; flex-wrap: wrap; }
        nav a, nav button { color: #fff; text-decoration: none; padding: 0.5rem 1rem; background: #334155; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        nav a:hover, nav button:hover { background: var(--primary); color: #000; }
        
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .post-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; margin-bottom: 2rem; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .post-card img, .post-card iframe { width: 100%; max-height: 400px; object-fit: cover; border: none; }
        .post-body { padding: 1.5rem; }
        .badge { background: var(--primary); color: #000; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 0.5rem; }
        
        .channel-btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .channel-btn:hover { background: #1d4ed8; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid var(--primary); max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 0.7rem; margin: 0.5rem 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        .btn { width: 100%; padding: 0.8rem; background: var(--primary); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; margin-top: 0.5rem; }
        .btn-danger { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>✨ مجموعة استار لينك القابضة ✨</h1>
        <p>الأخبار، العروض، وأحدث المشروعات والألعاب قيد التطوير</p>
    </header>

    <nav>
        <a href="/">الرئيسية</a>
        <a href="/shop">متجر الملفات والتطبيقات</a>
        <button onclick="openLogin()">⚙️ لوحة نشر الرئيسية</button>
    </nav>

    <div class="container" id="postsContainer">
        <!-- ستظهر المنشورات والقنوات هنا تلقائياً -->
    </div>

    <!-- نافذة تسجيل الدخول للمدير -->
    <div id="loginBox" class="modal">
        <div class="modal-content" style="max-width:350px;">
            <h3>دخول المدير</h3>
            <input type="password" id="adminPassword" placeholder="كلمة المرور">
            <button class="btn" onclick="loginMainAdmin()">دخول</button>
            <button class="btn btn-danger" onclick="closeModal('loginBox')">إلغاء</button>
        </div>
    </div>

    <!-- لوحة نشر الفيديوهات، الصور، الألعاب، وروابط القنوات -->
    <div id="mainAdminPanel" class="modal">
        <div class="modal-content">
            <h3>📢 نشر جديد بالصفحة الرئيسية</h3>
            <input type="text" id="postTitle" placeholder="عنوان المنشور أو اسم القناة/المشروع">
            
            <select id="postCategory">
                <option value="قيد التطوير">🕹️ لعبة / مشروع قيد التطوير</option>
                <option value="قناة / رابط">🔗 رابط قناة أو منصة اجتماعية</option>
                <option value="إعلان">📢 إعلان مهم / عرض</option>
                <option value="فيديو">🎬 فيديو ترويجي / شرح</option>
                <option value="صورة">🖼️ معرض صور</option>
            </select>
            
            <textarea id="postDesc" placeholder="تفاصيل المنشور أو وصف القناة..."></textarea>
            <input type="text" id="postMedia" placeholder="رابط الصورة (URL)">
            <input type="text" id="postVideo" placeholder="رابط فيديو اليوتيوب (اختياري)">
            <input type="text" id="postLink" placeholder="رابط القناة أو الموقع الخارجي (اختياري)">
            
            <button class="btn" onclick="submitMainPost()">🚀 نشر في الصفحة الرئيسية</button>
            <button class="btn btn-danger" onclick="closeModal('mainAdminPanel')">إغلاق</button>
        </div>
    </div>

    <script>
        // جلب المنشورات من السيرفر
        async function loadPosts() {
            try {
                let res = await fetch('/api/posts');
                let posts = await res.json();
                let html = "";
                
                posts.forEach(p => {
                    let mediaHtml = "";
                    if (p.videoUrl) {
                        mediaHtml = `<iframe src="${p.videoUrl}" height="300" allowfullscreen></iframe>`;
                    } else if (p.mediaUrl) {
                        mediaHtml = `<img src="${p.mediaUrl}" alt="media">`;
                    }

                    let linkBtn = p.link ? `<br><a href="${p.link}" target="_blank" class="channel-btn">🔗 زيارة الرابط / القناة</a>` : "";

                    html += `
                    <div class="post-card">
                        ${mediaHtml}
                        <div class="post-body">
                            <span class="badge">${p.category}</span>
                            <h2 style="margin:10px 0; color:var(--primary);">${p.title}</h2>
                            <p style="color:#94a3b8; line-height:1.6;">${p.desc}</p>
                            ${linkBtn}
                        </div>
                    </div>`;
                });
                document.getElementById("postsContainer").innerHTML = html;
            } catch (err) {
                console.error("خطأ في جلب المنشورات", err);
            }
        }

        // التحقق من تسجيل دخول الأدمن
        async function loginMainAdmin() {
            let pass = document.getElementById("adminPassword").value;
            try {
                let res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password: pass })
                });
                let data = await res.json();
                if(data.success) {
                    sessionStorage.setItem('token', data.token);
                    closeModal('loginBox');
                    document.getElementById("adminPassword").value = "";
                    document.getElementById("mainAdminPanel").style.display = "flex";
                } else {
                    alert(data.message);
                }
            } catch(e) {
                alert("تعذر الاتصال بالسيرفر");
            }
        }

        // إرسال منشور جديد متضمن الروابط والفيديوهات
        async function submitMainPost() {
            let token = sessionStorage.getItem('token');
            let postData = {
                token: token,
                title: document.getElementById("postTitle").value,
                category: document.getElementById("postCategory").value,
                desc: document.getElementById("postDesc").value,
                mediaUrl: document.getElementById("postMedia").value,
                videoUrl: document.getElementById("postVideo").value,
                link: document.getElementById("postLink").value
            };

            try {
                let res = await fetch('/api/posts/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(postData)
                });
                let data = await res.json();
                if(data.success) {
                    closeModal('mainAdminPanel');
                    loadPosts();
                    alert(data.message);
                } else {
                    alert(data.message);
                }
            } catch(e) {
                alert("حدث خطأ أثناء النشر");
            }
        }

        function openLogin() {
            if(sessionStorage.getItem('token')) {
                document.getElementById("mainAdminPanel").style.display = "flex";
            } else {
                document.getElementById("loginBox").style.display = "flex";
            }
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = "none"; 
        }

        window.onload = loadPosts;
    </script>

</body>
</html>
